[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-watch"
version = "4.0.0"
description = "Sequential API, MCP, Policy, and Cloud Quota Drift Radar with Coprime Weyl HTTP 304 Scheduling, Ville E-Processes, and RFC 6962 Transparency Receipts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alp Albayrak" }]
requires-python = ">=3.10"
keywords = [
  "change-point-detection",
  "cusum",
  "e-processes",
  "weyl-equidistribution",
  "certificate-transparency",
  "rfc6962",
  "rfc8785",
  "cloudflare-workers",
  "sarif",
  "lean4",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: TypeScript",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: System :: Monitoring",
]

[project.scripts]
drift-watch = "drift_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["drift_watch*"]
