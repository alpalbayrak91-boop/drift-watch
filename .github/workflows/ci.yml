name: Drift-Watch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-py310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and run test suite with Node cross-runtime parity
        run: |
          python -m pip install -e .
          python -W error::DeprecationWarning -m unittest discover -s tests -v

  test-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and run test suite with Node cross-runtime parity
        run: |
          python -m pip install -e .
          python -W error::DeprecationWarning -m unittest discover -s tests -v

  test-py312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package, run tests, and verify DriftBench-50 reproducibility
        run: |
          python -m pip install -e .
          python -W error::DeprecationWarning -m unittest discover -s tests -v
          python bench/driftbench_50/run_driftbench_50.py

  verify-lean4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and verify 33 Lean 4 formal soundness theorems with trust=0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          ~/.elan/bin/lean --trust=0 -DwarningAsError=true formal/DriftWatchV4Formal.lean
          ~/.elan/bin/lean --trust=0 -DwarningAsError=true formal/DriftWatchStreamSoundness.lean
