# Drift-Watch v3.9.0 Wrangler Configuration (Dec 1 2026 Split Observability Free Tier Shield)
# Strict KURAL-3 hygiene: 0 chr(36); USD only.

name = "alplab-drift-watch-v39"
main = "src/cf_drift_watch_v39_worker.js"
compatibility_date = "2026-11-24"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DRIFT_DB"
database_name = "alplab-drift-watch-v39-db"
database_id = "00000000-0000-0000-0000-000000000000"

[observability]
enabled = true
head_sampling_rate = 0.10

[observability.logs]
enabled = true
head_sampling_rate = 0.10
invocation_logs = false

[observability.traces]
enabled = false

[vars]
MAX_TARGETS_PER_TICK = "4"
ZCL_WEEKLY_PC_BUDGET_MIN = "60"
ZCL_CLIFF_RESERVE_MIN = "20"
SHADOW_GAMMA = "0.85"
EWMA_GAMMA_DECAY = "0.92"
LAGRANGE_NU_REF = "16.2744"
T24H_CLIFF_MAX_PERIOD_MIN = "240"
GUARD_BAND_EPS = "0.08"
FETCH_TIMEOUT_MS = "8000"
TELEMETRY_RETENTION_HOURS = "168"
WORKERS_AI_MODE = "DETERMINISTIC_REGEX_ONLY"
WORKERS_AI_ESCALATION_MODEL = "@cf/openai/gpt-oss-20b"
