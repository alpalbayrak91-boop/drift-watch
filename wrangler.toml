# Drift-Watch v4.0.0 Cloudflare Workers Configuration
# Zero secrets tracked; Dec 1 Observability Split-Billing Shield & Zero-Neuron AI Cliff Guard enabled.

name = "drift-watch-v4"
main = "worker/cf_drift_watch_v4.ts"
compatibility_date = "2026-11-24"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DRIFT_DB"
database_name = "drift-watch-v4-db"
database_id = "00000000-0000-0000-0000-000000000000"

[observability]
enabled = true
head_sampling_rate = 0.10

[observability.logs]
enabled = true
head_sampling_rate = 0.10
invocation_logs = false

[observability.traces]
enabled = false

[vars]
MAX_TARGETS_PER_TICK = "4"
CUSUM_K_SLACK_BPS = "1200"
CUSUM_H_THRESH_BPS = "4800"
PH_DELTA_BPS = "350"
PH_LAMBDA_THRESH_BPS = "5200"
CORROBORATION_WINDOW = "4"
FETCH_TIMEOUT_MS = "8000"
TELEMETRY_RETENTION_HOURS = "168"
WORKERS_AI_MODE = "DETERMINISTIC_REGEX_ONLY"
